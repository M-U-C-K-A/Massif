[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace.dependencies]
massif-core = { path = "crates/massif-core" }
massif-format = { path = "crates/massif-format" }
massif-anvil = { path = "crates/massif-anvil" }
massif-legacy = { path = "crates/massif-legacy" }
massif-assets = { path = "crates/massif-assets" }
massif-objects = { path = "crates/massif-objects" }
massif-thumbnails = { path = "crates/massif-thumbnails" }

rayon = "1.12"
zstd = "0.14"
crc32c = "0.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Keep our own code debuggable but make the heavy dependencies (zstd, egui,
# wgpu, the codecs) fast enough that a debug build stays interactive.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"

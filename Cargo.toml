[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace.dependencies]
massif-core = { path = "crates/massif-core" }
massif-format = { path = "crates/massif-format" }
massif-anvil = { path = "crates/massif-anvil" }
massif-legacy = { path = "crates/massif-legacy" }
massif-assets = { path = "crates/massif-assets" }
massif-objects = { path = "crates/massif-objects" }
massif-structures = { path = "crates/massif-structures" }
massif-thumbnails = { path = "crates/massif-thumbnails" }
massif-render = { path = "crates/massif-render" }
massif-script = { path = "crates/massif-script" }

rayon = "1.12"
zstd = "0.14"
crc32c = "0.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = { version = "1.8", default-features = false, features = ["std", "neon"] }
getrandom = "0.3"
# OpenEXR: float height maps and HDR renders (pure Rust, BSD-3-Clause).
exr = { version = "1.74", default-features = false, features = ["rayon"] }

# Keep our own code debuggable but make the heavy dependencies (zstd, egui,
# wgpu, the codecs) fast enough that a debug build stays interactive.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
# One unit: about 5 % less work everywhere (exporting a map measured), for
# a longer build.
codegen-units = 1

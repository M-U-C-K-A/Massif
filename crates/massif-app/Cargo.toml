[package]
name = "massif-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "massif"
path = "src/main.rs"

[dependencies]
massif-core.workspace = true
massif-format.workspace = true
massif-anvil.workspace = true
massif-legacy.workspace = true
massif-assets.workspace = true
massif-objects.workspace = true
massif-thumbnails.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "clipboard", "links", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "metal", "dx12", "vulkan", "gles"] }
lucide-icons = "1.71"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }
# The menus in the system's menu bar (`menubar`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
fastnbt = "2.6"
flate2.workspace = true

[build-dependencies]
# The icon of massif.exe in Windows' Explorer.
winresource = "0.1"

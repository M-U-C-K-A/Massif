[package]
name = "massif-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "massif"
path = "src/main.rs"

[dependencies]
massif-core.workspace = true
massif-format.workspace = true
massif-anvil.workspace = true
massif-legacy.workspace = true
massif-script.workspace = true
massif-assets.workspace = true
massif-objects.workspace = true
massif-thumbnails.workspace = true
massif-render.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
# The problem report's zip (`report`).
flate2.workspace = true
crc32fast = "1.5"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "clipboard", "links", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
# The scopes of egui, eframe, wgpu and Massif, for the performance
# recorder (`perf`): they reach its `tracing` subscriber.
profiling = { version = "1.0.18", default-features = false, features = ["profile-with-tracing"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "metal", "dx12", "vulkan", "gles"] }
lucide-icons = "1.71"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
pollster = "1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Asks GitHub for the latest release (`update`), over rustls: no system
# TLS library to need on Linux.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The system's Quit read and answered (`quit`): its Apple Event, and the
# answer given from the run loop.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSAppleEventDescriptor", "NSAppleEventManager", "NSRunLoop", "NSDate", "NSObjCRuntime", "NSLocale"] }
# The menus in the system's menu bar (`menubar`), and the screens a
# floating panel's window opens on (`screens`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSScreen"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
# The tests can draw with OpenGL on macOS too, through ANGLE (see
# docs/internals.md); the app itself does not ship it.
wgpu = { version = "30", default-features = false, features = ["angle"] }
fastnbt = "2.6"
# The regions of an export read back (see `real_place_with_another_palette`).
fastanvil = { version = "0.32", default-features = false }

[build-dependencies]
# The icon of massif.exe in Windows' Explorer.
winresource = "0.1"

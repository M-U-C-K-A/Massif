[package]
name = "massif-thumbnails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows Explorer thumbnails of Massif maps: the picture a .massif file keeps of its map, as the file's icon"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
massif-core.workspace = true
massif-format.workspace = true

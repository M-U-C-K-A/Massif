[package]
name = "massif-terrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Massif's terrain generator: a node graph evaluated by tiles and levels of detail, on the GPU or the CPU"

[features]
default = ["gpu"]
# Kernels on the graphics card (wgpu compute). Without it, everything runs on
# the CPU, which every kernel can.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "metal", "dx12", "vulkan", "gles"], optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
png = "0.18"

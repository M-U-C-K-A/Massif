[package]
name = "massif-terrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Massif's terrain generator: a node graph evaluated by tiles and levels of detail, on the GPU or the CPU"

[dependencies]
massif-core.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "metal", "dx12", "vulkan", "gles"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = { version = "1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }

[dev-dependencies]
png = "0.18"

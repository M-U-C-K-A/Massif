name: Website

# Builds site/ (with docs/ and the release notes) and publishes it on GitHub
# Pages. Pages must be set to "GitHub Actions" in the repository's settings.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/RELEASE_NOTES.md', '.github/workflows/pages.yml']
  # A new release changes the download buttons.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

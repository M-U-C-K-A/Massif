<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" >
          
          <defs>
            <linearGradient id="grad-top-dl-voxel-peak" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fed7aa" />
              <stop offset="100%" stop-color="#f97316" />
            </linearGradient>
          </defs>
          <!-- Outer Subtle Isometric Hex Frame -->
          <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" fill="#1e293b" fill-opacity="0.45" stroke="#ea580c" stroke-opacity="0.35" stroke-width="1.5"  />
          
          <!-- Left Peak Column (M Left Leg) -->
          <!-- Top Snow Cap Left -->
          <polygon points="38,24 52,32 38,40 24,32" fill="url(#grad-top-dl-voxel-peak)"/>
          <polygon points="24,32 38,40 38,84 24,76" fill="#f97316"/>
          <polygon points="38,40 52,32 52,76 38,84" fill="#9a3412"/>

          <!-- Right Peak Column (M Right Leg) -->
          <!-- Top Snow Cap Right -->
          <polygon points="82,24 96,32 82,40 68,32" fill="url(#grad-top-dl-voxel-peak)"/>
          <polygon points="68,32 82,40 82,84 68,76" fill="#f97316"/>
          <polygon points="82,40 96,32 96,76 82,84" fill="#9a3412"/>

          <!-- Center Voxel Saddle Bridge (Forming the M Valley) -->
          <polygon points="60,46 74,54 60,62 46,54" fill="#fed7aa"/>
          <polygon points="46,54 60,62 60,92 46,84" fill="#f97316"/>
          <polygon points="60,62 74,54 74,84 60,92" fill="#ea580c"/>

          <!-- Foreground Terraced Voxel Steps -->
          <polygon points="38,68 52,76 38,84 24,76" fill="#fed7aa" fill-opacity="0.85"/>
          <polygon points="24,76 38,84 38,98 24,90" fill="#ea580c"/>
          <polygon points="38,84 52,76 52,90 38,98" fill="#9a3412"/>

          <polygon points="82,68 96,76 82,84 68,76" fill="#fed7aa" fill-opacity="0.85"/>
          <polygon points="68,76 82,84 82,98 68,90" fill="#ea580c"/>
          <polygon points="82,84 96,76 96,90 82,98" fill="#9a3412"/>
        
        </svg>